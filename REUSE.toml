version = 1

# The last matching annotation sets a file's copyright and license.

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ImproperSubset"
SPDX-License-Identifier = "GPL-3.0-only"

# Copied unchanged from the Call of Cthulhu 7th Edition system
[[annotations]]
path = [".editorconfig", "eslint.config.js", "webpack.config.js"]
precedence = "override"
SPDX-FileCopyrightText = "Miskatonic Investigative Society"
SPDX-License-Identifier = "GPL-3.0-only"

# Modified from the Call of Cthulhu 7th Edition system
[[annotations]]
path = ["scripts/init.js", "scripts/webpack-config.js", "scripts/src/template-helpers.js", "static/templates/group-check.hbs", "hh-coc7-group-check/apps/group-check-dialog.js"]
precedence = "override"
SPDX-FileCopyrightText = ["Miskatonic Investigative Society", "2026 ImproperSubset"]
SPDX-License-Identifier = "GPL-3.0-only"

# The shared rules, installed from hh-rules by rulesync.
[[annotations]]
path = ".claude/rules/*.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 ImproperSubset"
SPDX-License-Identifier = "MIT"

# The project's own rules.
[[annotations]]
path = ".claude/rules/coc7-group-check-*.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 ImproperSubset"
SPDX-License-Identifier = "GPL-3.0-only"

# hh-rules' scripts and their REUSE.toml, copied from hh-rules at the project's tag;
# the root "**" entry overrides .hh/shared/REUSE.toml, so they are labelled here
# (diary decision 2026-11-16: hh-rules' copies labelled at the root).
[[annotations]]
path = ".hh/shared/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ImproperSubset"
SPDX-License-Identifier = "MIT"

# hh-rules' tool configs, copied from hh-rules at the project's tag.
[[annotations]]
path = [".mdformat.toml", ".markdownlint-cli2.jsonc", ".shellcheckrc", ".jscpd.jsonc"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ImproperSubset"
SPDX-License-Identifier = "MIT"

# hh-rules' skills, pinned at the project's tag and generated by rulesync.
[[annotations]]
path = ".claude/skills/hh-*/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ImproperSubset"
SPDX-License-Identifier = "MIT"

# jscpd's skills, pinned at the jscpd release hh-rules pins.
[[annotations]]
path = [".claude/skills/dry-refactoring/**", ".claude/skills/jscpd/**"]
precedence = "override"
SPDX-FileCopyrightText = "2013-2024 Andrey Kucherenko"
SPDX-License-Identifier = "MIT"
